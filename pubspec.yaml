name: zenit
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.9.2

dependencies:
  dio: ^5.9.0
  fl_chart: ^0.69.0
  flutter:
    sdk: flutter
  flutter_secure_storage: ^9.2.4
  google_fonts: ^6.3.2
  google_nav_bar: ^5.0.7
  intl: ^0.19.0
  material_symbols_icons: ^4.0.0
  provider: ^6.1.5+1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
      - assets/

  fonts:
    - family: GoogleSansFlex 
      fonts:
        - asset: assets/fonts/GoogleSansFlex.ttf
    - family: MaterialSymbolsMain
      fonts:
        - asset: assets/icons/MaterialSymbolsRounded.ttf
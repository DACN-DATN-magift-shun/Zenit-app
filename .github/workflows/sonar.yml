name: SonarCloud Analysis

on:
  push:
    branches:
      - main
      - manage-feat
  pull_request:
    branches:
      - main
      - manage-feat

jobs:
  sonarcloud:
    name: SonarCloud Scan
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4 
        with:
          fetch-depth: 0 
      
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          # TẮT cái này để không bị dính lỗi actions/cache cũ của bản thân subosito
          cache: false

      - name: Get dependencies
        run: flutter pub get

      - name: Run tests with coverage
        run: flutter test --coverage
      
      - name: SonarCloud Scan
        # Dùng v3.1.0 để ổn định trên môi trường Linux/Docker, tránh lỗi .exe
        uses: SonarSource/sonarcloud-github-action@v3.1.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        # XÓA SONAR_BRANCH_NAME: main ở đây vì nó sẽ tự nhận diện từ Git Context.
        # Ép nó về main khi đang ở nhánh feat là nó loạn coverage ngay.